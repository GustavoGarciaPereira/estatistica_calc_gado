[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aplicação Leptos de rentabilidade de lotes"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", default-features = false }
domain = { path = "../domain", optional = true, features = ["serde"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "macros",
    "derive",
    "postgres",
    "runtime-tokio",
    "chrono",
    "uuid",
] }
serde = { workspace = true }
server_fn = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
wasm-bindgen = "0.2"
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }

[features]
default = ["csr", "hydrate"]
csr = ["leptos/csr", "dep:domain"]
hydrate = ["leptos/hydrate", "dep:domain"]
ssr = [
    "leptos/ssr",
    "dep:sqlx",
    "dep:domain",
    "dep:leptos_axum",
    "dep:axum",
]
